  </g>
  <!-- Dot inside A of LANCER -->
  <circle cx="77" cy="118" r="4" fill="#0f172a" />

  <!-- Subtitle: "NOT JUST TRAFFIC, REAL CONVERSIONS." -->
  <text x="24" y="152" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8.8" font-weight="800" fill="#0f172a" letter-spacing="0.08em">NOT JUST TRAFFIC, REAL CONVERSIONS.</text>
